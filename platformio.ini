; Official PlatformIO espressif32 tops out at Arduino core 2.x; pioarduino is
; the community fork shipping arduino-esp32 3.x (IDF 5.x). Both S3 envs pin its
; rolling 'stable' release so every machine builds against the same core.
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Force 4MB flash size and matching partition table
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Keep the USB CDC flags
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-I include
build_src_filter =
	+<*>
	-<dongle/*>

upload_speed = 921600
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPR121 @ ^1.1.3
    adafruit/Adafruit NeoPixel @ ^1.12.0

[env:esp8266-nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_upload.flash_size = 4MB
build_flags =
	-I include
build_src_filter =
	+<*>
	-<dongle/*>
upload_speed = 460800
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPR121 @ ^1.1.3
    adafruit/Adafruit NeoPixel @ ^1.12.0

[env:d1_mini]
platform = espressif8266
board = d1_mini
