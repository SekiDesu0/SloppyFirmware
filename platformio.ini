; ---------------------------------------------------------------------------
; ESP32-S3 USB HID dongle: pairs with gloves over ESP-NOW, exposes sensor
; frames to the PC as vendor-defined HID input reports (+ CDC console).
; TinyUSB required for HID -> ARDUINO_USB_MODE=0.
; ---------------------------------------------------------------------------
[env:esp32s3-dongle]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Replace the board json's extra_flags wholesale (they hardwire ARDUINO_USB_MODE=1,
; which compiles Serial as HWCDC/JTAG-unit and fights TinyUSB for the PHY).
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	; Core boots TinyUSB + its CDC interface; Adafruit HID joins the same stack.
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_VID=0x303A
	-D ARDUINO_USB_PID=0x534C
	; DevKitC-1 v1.0 RGB on GPIO48 (v1.1+ moved it to 38; SuperMini clones: 48)
	-D DONGLE_RGB_LED=48
	-I include
build_src_filter =
	-<main.cpp>
	+<dongle/*>
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit NeoPixel @ ^1.12.0
