lib_deps =
    adafruit/Adafruit MPR121 @ ^1.1.3
    adafruit/Adafruit NeoPixel @ ^1.12.0

; ---------------------------------------------------------------------------
; ESP32-S3 USB HID dongle: pairs with gloves over ESP-NOW, exposes sensor
; frames to the PC as vendor-defined HID input reports (+ CDC console).
; Uses the core's bundled TinyUSB stack (USBHID classes) -> ARDUINO_USB_MODE=0.
; Do NOT add the Adafruit TinyUSB library: it compiles its own copy of the
; stack, which collides with the core's (duplicate symbols / crashes, most
; visibly on Windows builds).
; ---------------------------------------------------------------------------
[env:esp32s3-dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Replace the board json's extra_flags wholesale (they hardwire ARDUINO_USB_MODE=1,
; which compiles Serial as HWCDC/JTAG-unit and fights the TinyUSB PHY).
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	; CDC_ON_BOOT must stay 0: =1 makes the core auto-start USB with default
	; descriptors before setup(), which breaks native-USB enumeration (device
	; never shows up; only the ROM USB-JTAG-serial unit remains visible).
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_USB_VID=0x303A
	-D ARDUINO_USB_PID=0x534C
	; DevKitC-1 v1.0 RGB on GPIO48 (v1.1+ moved it to 38; SuperMini clones: 48)
	-D DONGLE_RGB_LED=48
	-I include
build_src_filter =
	-<main.cpp>
	+<dongle/*>
; Knock the running app into the bootloader before esptool starts, so
; 'pio run -t upload' works in one shot (see tools/dongle_preupload.py).
extra_scripts = pre:tools/dongle_preupload.py
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
